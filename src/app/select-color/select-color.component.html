<div class="select-color">
  <h4 class="select-color__label">{{ label }}</h4>

  <div class="select-color__swatches">
    <button
      type="button"
      class="swatch"
      *ngFor="let color of colors"
      [class.swatch--active]="color === selectedColor"
      [style.background-color]="color"
      [attr.aria-label]="color"
      (click)="selectColor(color)"
    ></button>
  </div>

  <p class="select-color__chosen" *ngIf="selectedColor">
    Selected: <strong>{{ selectedColor }}</strong>
  </p>
</div>
